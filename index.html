        // --- GENERAL HELPER FOR GEMINI API CALLS (PROXIED THROUGH NETLIFY FUNCTION) ---
        async function callGeminiAPI(prompt, chatHistory, outputElement, errorElement, loadingSpinner, buttonTextElement) {
            if (!prompt) return; // Ensure there's a prompt

            // Add the current user prompt to history
            // chatHistory is modified directly, so we need to ensure it's a deep copy
            let currentChatHistory = JSON.parse(JSON.stringify(chatHistory || []));
            currentChatHistory.push({ role: "user", parts: [{ text: prompt }] });

            const apiUrl = "/.netlify/functions/gemini-proxy";

            const originalButtonText = buttonTextElement.dataset.originalText || buttonTextElement.textContent;
            buttonTextElement.textContent = 'Processing...';
            loadingSpinner.classList.remove('hidden');
            buttonTextElement.parentElement.disabled = true;
            outputElement.parentElement.classList.add('hidden'); // Hide result container
            errorElement.classList.add('hidden'); // Hide error message

            const maxRetries = 5;
            let currentRetry = 0;
            let success = false;
            let responseText = ''; // To store the successful response text

            while (currentRetry < maxRetries && !success) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: prompt, chatHistory: currentChatHistory })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        console.error("Netlify Function Error Response:", errorData);
                        throw new Error(`Function error! status: ${response.status} - ${errorData.message || 'Unknown error'}`);
                    }

                    const result = await response.json();

                    if (result.text) {
                        responseText = result.text;
                        outputElement.innerHTML = marked.parse(responseText);
                        outputElement.parentElement.classList.remove('hidden');
                        chatHistory.push({ role: "model", parts: [{ text: responseText }] }); // Update original chatHistory
                        success = true;
                    } else {
                        throw new Error('Unexpected Netlify Function response structure or no content.');
                    }
                } catch (error) {
                    console.error('Error fetching recommendation via Netlify Function:', error);
                    currentRetry++;
                    if (currentRetry < maxRetries) {
                        const delay = Math.pow(2, currentRetry) * 1000;
                        await new Promise(res => setTimeout(res, delay));
                    } else {
                        errorElement.classList.remove('hidden');
                        errorElement.innerHTML = `<p>Error: ${error.message}. Please try again.</p>`;
                        outputElement.innerHTML = '';
                    }
                } finally {
                    if (currentRetry >= maxRetries || success) {
                        buttonTextElement.textContent = originalButtonText;
                        loadingSpinner.classList.add('hidden');
                        buttonTextElement.parentElement.disabled = false;
                    }
                }
            }
            return success ? responseText : null; // Return the response text if successful
        }

        // --- PRODUCT REVIEWS (Firebase) ---
        async function loadProductReviews() {
            if (!db) {
                console.log("Firestore not initialized for reviews.");
                return;
            }

            const productIds = ['hard', 'medium', 'soft'];
            productIds.forEach(productId => {
                const reviewsDisplay = document.getElementById(`reviews-${productId}`);
                if (!reviewsDisplay) return;

                const reviewsCollectionRef = collection(db, `artifacts/${appId}/public/data/productReviews_${productId}`);
                const q = query(reviewsCollectionRef, orderBy('timestamp', 'desc'));

                onSnapshot(q, (snapshot) => {
                    reviewsDisplay.innerHTML = ''; // Clear existing reviews
                    if (snapshot.empty) {
                        reviewsDisplay.innerHTML = '<p class="text-gray-400 text-sm">No reviews yet. Be the first!</p>';
                    } else {
                        snapshot.forEach((doc) => {
                            const review = doc.data();
                            const stars = '⭐'.repeat(parseInt(review.rating));
                            const reviewElement = document.createElement('div');
                            reviewElement.className = 'bg-gray-800 p-4 rounded-lg border border-gray-700';
                            reviewElement.innerHTML = `
                                <p class="text-yellow-400">${stars}</p>
                                <p class="text-gray-200 mt-1">${marked.parse(review.content || '')}</p>
                                <p class="text-gray-400 text-xs mt-2">- ${review.author || 'Anonymous'}, ${review.timestamp ? new Date(review.timestamp.seconds * 1000).toLocaleDateString() : 'Just now'}</p>
                            `;
                            reviewsDisplay.appendChild(reviewElement);
                        });
                    }
                }, (error) => {
                    console.error(`Error listening to ${productId} reviews:`, error);
                    reviewsDisplay.innerHTML = '<p class="text-red-400">Failed to load reviews.</p>';
                });
            });

            document.querySelectorAll('.review-form').forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!db || !userId) {
                        form.querySelector('.review-message').textContent = "Firebase not ready. Cannot submit review.";
                        form.querySelector('.review-message').style.color = 'red';
                        return;
                    }

                    const productId = form.dataset.product;
                    const author = form.querySelector('.review-name').value.trim();
                    const rating = form.querySelector('.review-rating').value;
                    const content = form.querySelector('.review-content').value.trim();
                    const messageElement = form.querySelector('.review-message');

                    if (!author || !rating || !content) {
                        messageElement.textContent = "Please fill all review fields.";
                        messageElement.style.color = 'red';
                        return;
                    }

                    messageElement.textContent = "Submitting review...";
                    messageElement.style.color = 'cyan';

                    try {
                        await addDoc(collection(db, `artifacts/${appId}/public/data/productReviews_${productId}`), {
                            productId: productId,
                            author: author,
                            rating: parseInt(rating),
                            content: content,
                            timestamp: serverTimestamp(),
                            userId: userId
                        });
                        messageElement.textContent = "Review submitted successfully!";
                        messageElement.style.color = 'lightgreen';
                        form.reset();
                    } catch (error) {
                        console.error("Error submitting review:", error);
                        messageElement.textContent = "Failed to submit review. Try again.";
                        messageElement.style.color = 'red';
                    }
                });
            });
        }
